apiVersion: v2
name: tableschnappi
description: >
  Full-stack AI-powered restaurant management and reservation system built on
  Red Hat OpenShift AI. Includes a real-time floor plan, QR ordering, an
  AI reservation assistant backed by any OpenAI-compatible endpoint
  (in-cluster vLLM or a MaaS gateway), NeMo Guardrails, MLflow GenAI tracing
  + Prompt Registry, garak red-team evaluation, and an MCP server wired into
  the RHOAI GenAI Studio playground.
