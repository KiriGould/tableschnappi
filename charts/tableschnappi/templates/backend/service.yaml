apiVersion: v1
kind: Service
metadata:
  name: {{ include "tableschnappi.backendService" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tableschnappi.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  selector:
    {{- include "tableschnappi.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  ports:
    - port: 3001
      targetPort: 3001
      protocol: TCP
