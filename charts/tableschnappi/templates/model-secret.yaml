{{- /*
Created only when the user hands Helm a token directly. If they point at a
Secret they manage themselves (model.existingSecret / rhoai.modelApiKeySecret)
we reference that instead and create nothing, so Helm never takes ownership of
a Secret it did not make.
*/ -}}
{{- if and .Values.model.apiKey (not .Values.model.existingSecret) (not .Values.rhoai.modelApiKeySecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tableschnappi.modelSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tableschnappi.labels" . | nindent 4 }}
  annotations:
    # Must be a hook, and must outrank the pre-install hooks that read it.
    # Helm applies every pre-install hook before any plain manifest, so as a
    # plain resource this Secret did not exist yet when pre-wait-model (weight
    # 2) mounted it — the hook pod failed with CreateContainerConfigError and
    # the install hung until timeout. Weight -2 puts it ahead of the
    # ServiceAccount (-1) and everything after.
    #
    # No hook-succeeded delete policy: the steady-state assistant Deployment
    # reads this Secret too, so it has to persist past install.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-2"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  token: {{ .Values.model.apiKey | quote }}
{{- end }}
