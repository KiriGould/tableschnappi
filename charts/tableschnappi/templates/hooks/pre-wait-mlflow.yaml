{{- if .Values.mlflow.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "tableschnappi.fullname" . }}-wait-mlflow
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tableschnappi.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "tableschnappi.selectorLabels" . | nindent 8 }}
        app: wait-mlflow
    spec:
      serviceAccountName: {{ include "tableschnappi.mlflowProxyService" . }}
      {{- include "tableschnappi.imagePullSecrets" . | nindent 6 }}
      restartPolicy: Never
      containers:
        - name: wait
          image: curlimages/curl:8.6.0
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for MLflow at {{ required "rhoai.mlflowUri is required when mlflow.enabled=true. Copy it from the RHOAI dashboard under Experiments, e.g. https://rh-ai.<apps-domain>/mlflow . Set mlflow.enabled=false to run without tracing." .Values.rhoai.mlflowUri }} ..."
              TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              for i in $(seq 1 60); do
                if curl -sk --max-time 5 "{{ required "rhoai.mlflowUri is required when mlflow.enabled=true. Copy it from the RHOAI dashboard under Experiments, e.g. https://rh-ai.<apps-domain>/mlflow . Set mlflow.enabled=false to run without tracing." .Values.rhoai.mlflowUri }}/api/2.0/mlflow/experiments/search?max_results=1" \
                     -H "Authorization: Bearer ${TOKEN}" \
                     -H "X-Mlflow-Workspace: {{ .Release.Namespace }}" -o /dev/null -w "%{http_code}" | grep -qE "^2"; then
                  echo "MLflow is ready."
                  exit 0
                fi
                echo "  attempt $i/60 — retrying in 5s..."
                sleep 5
              done
              # The old message here was just "not reachable", which reads like a
              # typo in the URI. The usual cause on RHOAI 3.6+ is different and
              # much less guessable: the operator is installed but nobody has
              # created an MLflow instance, so there is no tracking server to
              # reach. Say which of the two it is.
              echo ""
              echo "ERROR: MLflow did not answer at the URI above after 5 minutes."
              echo ""
              echo "Most likely causes, in order:"
              echo ""
              echo "  1. No MLflow instance exists. RHOAI 3.6 ships the operator but"
              echo "     no tracking server -- 3.5 shipped one, which is why this is"
              echo "     easy to miss. Check with:"
              echo "         oc get mlflows.mlflow.opendatahub.io"
              echo "     An empty list means you need to create one; see the README"
              echo "     section 'MLflow on RHOAI 3.6 and later'."
              echo ""
              echo "  2. rhoai.mlflowUri points somewhere else. Find the real one:"
              echo "         oc get svc -A | grep -w mlflow"
              echo ""
              echo "  3. This namespace cannot reach it, or the ServiceAccount token"
              echo "     is not accepted by the tracking server."
              echo ""
              echo "To install without tracing instead: --set mlflow.enabled=false"
              exit 1
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          securityContext:
            {{- include "tableschnappi.securityContext" . | nindent 12 }}
{{- end }}
