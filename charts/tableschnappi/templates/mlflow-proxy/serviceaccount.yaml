{{- if .Values.assistant.enabled }}
# Templated as a low-weight pre-install/pre-upgrade hook (rather than a plain
# resource) so it exists before the pre-wait-mlflow (weight 0) and
# pre-seed-mlflow (weight 1) hook Jobs run — plain templates are only applied
# *after* all pre-install hooks complete, which is too late for those Jobs.
# No hook-succeeded delete policy: the steady-state mlflow-proxy Deployment
# (a plain, non-hook resource) also needs this ServiceAccount to persist.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tableschnappi.mlflowProxyService" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tableschnappi.labels" . | nindent 4 }}
    app.kubernetes.io/component: mlflow-proxy
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation
{{- if .Values.mlflow.enabled }}
---
# Grants this namespace's ServiceAccounts data-plane access to the RHOAI MLflow
# tracking server. Required because MLflow authorizes every API call with a
# SelfSubjectAccessReview against the mlflow.kubeflow.org pseudo-resources —
# without this binding, MLFLOW_TRACKING_AUTH=kubernetes-namespaced still
# authenticates the caller but every call is denied with a 403.
#
# Gated on mlflow.enabled, NOT assistant.enabled. The referenced ClusterRole is
# created by the RHOAI MLflow operator, so on a cluster without it this binding
# is unresolvable: harmless for a cluster-admin, but RBAC's escalation check
# rejects it outright for the namespace-scoped user that values-maas.yaml is
# written for — which turned the "needs no cluster-admin" profile into one that
# silently did.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "tableschnappi.mlflowProxyService" . }}-mlflow-integration
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tableschnappi.labels" . | nindent 4 }}
    app.kubernetes.io/component: mlflow-proxy
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation
subjects:
  - kind: ServiceAccount
    name: {{ include "tableschnappi.mlflowProxyService" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  # The operator-created role name has differed between RHOAI releases, so it
  # is a value rather than a literal. Verified present as
  # "mlflow-operator-mlflow-integration" on RHOAI 3.5.1; check yours with
  #   oc get clusterrole | grep mlflow
  name: {{ .Values.rhoai.mlflowIntegrationClusterRole }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
