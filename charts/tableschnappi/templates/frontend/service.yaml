apiVersion: v1
kind: Service
metadata:
  name: {{ include "tableschnappi.fullname" . }}-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tableschnappi.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  selector:
    {{- include "tableschnappi.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
