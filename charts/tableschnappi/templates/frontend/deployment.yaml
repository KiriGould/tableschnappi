apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tableschnappi.fullname" . }}-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tableschnappi.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "tableschnappi.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "tableschnappi.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      {{- include "tableschnappi.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: frontend
          image: {{ include "tableschnappi.image" (list . "frontend") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: BACKEND_HOST
              value: {{ include "tableschnappi.backendService" . }}
            - name: NGINX_ENVSUBST_TEMPLATE_VARS
              value: BACKEND_HOST
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources.frontend | nindent 12 }}
          securityContext:
            {{- include "tableschnappi.securityContext" . | nindent 12 }}
